`,k4=`; 8-LED ping-pong demo \u2014 one lit LED bouncing between bit 7 and bit 0
; LED bit 7..4 \u2192 PD7..PD4 (D7..D4), bit 3..0 \u2192 PB3..PB0 (D11..D8)
.equ DDRB,  0x04
.equ PORTB, 0x05
.equ DDRD,  0x0A
.equ PORTD, 0x0B
.def pattern = r20        ; the single lit bit

.global main
main:
    ldi  r16, 0x0F
    out  DDRB, r16        ; LED bits 0\u20133 on PB0\u2013PB3
    ldi  r16, 0xF0
    out  DDRD, r16        ; LED bits 4\u20137 on PD4\u2013PD7
    ldi  pattern, 0x80    ; start at the leftmost LED

move_right:
    rcall show            ; display, then wait 150 ms
    lsr  pattern          ; next LED to the right
    cpi  pattern, 0x01    ; reached bit 0?
    brne move_right
move_left:
    rcall show
    lsl  pattern          ; next LED to the left
    cpi  pattern, 0x80    ; reached bit 7?
    brne move_left
    rjmp move_right

; show \u2014 write pattern to both ports (same byte: each port only drives its own nibble)
show:
    out  PORTB, pattern
    out  PORTD, pattern
    rcall delay_150ms
    ret

; delay_150ms \u2014 2,400,001 cycles = 150.00006 ms at 16 MHz (A=18, B=199, C=222)
; cycles = A*(B*(3*C + 4) + 3) + 7   (including rcall + ret)
delay_150ms:
    ldi  r18, 18
outer:
    ldi  r19, 199
middle:
    ldi  r21, 222
inner:
    dec  r21
    brne inner
    nop
    dec  r19
    brne middle
    dec  r18
    brne outer
    ret
